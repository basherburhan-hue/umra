<!DOCTYPE html>

<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبۆردی ئەدمین - دیاری عمرە</title>

  <style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:linear-gradient(135deg,#031b12,#000);
color:white;
min-height:100vh;
padding:20px;
}

.glass{
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
border:1px solid rgba(255,215,0,.25);
border-radius:20px;
padding:20px;
margin-bottom:20px;
overflow-x:auto;
}

h1{
text-align:center;
color:#FFD700;
margin-bottom:20px;
}

h2{
color:#FFD700;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:rgba(255,255,255,.1);
color:white;
}

button{
padding:12px 20px;
background:#FFD700;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
color:black;
}

button:hover{
opacity:.9;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
min-width:650px;
}

th,td{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.1);
text-align:center;
}

th{
color:#FFD700;
}

.hidden{
display:none;
}

.count-box{
text-align:center;
font-size:40px;
font-weight:bold;
color:#FFD700;
}

@media (max-width:768px){

body{
padding:10px;
}

.glass{
padding:15px;
border-radius:15px;
}

h1{
font-size:22px;
}

h2{
font-size:18px;
}

input{
font-size:16px;
}

button{
font-size:14px;
padding:10px 15px;
}

th,
td{
font-size:13px;
padding:10px;
white-space:nowrap;
}

.count-box{
font-size:30px;
}

}
</style>

</head>
<body>

<div id="loginBox" class="glass">
<h1>چوونەژوورەوەی ئەدمین</h1>

<input type="password" id="password" placeholder="پاسوۆرد">

<button onclick="login()">
چوونەژوورەوە
</button>
</div>

<div id="dashboard" class="hidden">

<div class="glass">
<h1>🕋 داشبۆردی دیاری عمرە حاجی کاروان ستونی</h1>
</div>

<div class="glass">

<h2>🏢 زیادکردنی کۆمپانیا</h2>

<input id="companyName" placeholder="ناوی کۆمپانیا">

<input id="giftCount" placeholder="ژمارەی هەدیەی عمرە">

<input id="companyPhone" placeholder="ژمارەی مۆبایل">

<button onclick="addCompany()">
زیادکردن
</button>

</div>

<div class="glass">

<h2>کۆمپانیا بەژداربووەکان</h2>

<table>
<thead>
<tr>
<th>ناوی کۆمپانیا</th>
<th>هەدیەی عمرە</th>
<th>مۆبایل</th>
<th>کردار</th>
</tr>
</thead>

<tbody id="companiesTable"></tbody>

</table>

</div>

<div class="glass">

<h2>ڕێژەی تۆمارکراوەکان</h2>

<div id="count" class="count-box">0</div>

</div>

<div class="glass">

<h2>👥 لیستی تۆمارکراوان</h2>

<table>
<thead>
<tr>
<th>#</th>
<th>ناوی سیانی</th>
<th>مۆبایل</th>
</tr>
</thead>

<tbody id="registrations"></tbody>

</table>

</div>

</div>

<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
'https://slllcibigutjivauryvc.supabase.co',
'sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH'
)

const ADMIN_PASSWORD = "karwan123"

window.login = function(){

const pass = document.getElementById("password").value

if(pass === ADMIN_PASSWORD){

document.getElementById("loginBox").style.display="none"
document.getElementById("dashboard").classList.remove("hidden")

loadCompanies()
loadRegistrations()

}else{

alert("پاسوۆرد هەڵەیە")

}

}

window.addCompany = async function(){

const company_name =
document.getElementById("companyName").value

const umrah_gifts =
document.getElementById("giftCount").value

const phone =
document.getElementById("companyPhone").value

if(!company_name || !umrah_gifts || !phone){
alert("هەموو خانەکان پڕبکەرەوە")
return
}
  
const { data, error } =
await supabase
.from("companies")
.insert([{
  company_name: company_name,
  umrah_gifts: umrah_gifts,
  phone: phone
}])
.select()

console.log(data)
console.log(error)

if(error){
alert(error.message)
return
}

document.getElementById("companyName").value=""
document.getElementById("giftCount").value=""
document.getElementById("companyPhone").value=""

loadCompanies()

}

async function loadCompanies(){

const table =
document.getElementById("companiesTable")

const { data,error } =
await supabase
.from("companies")
.select("*")
.order("id",{ascending:false})

if(error){
console.log(error)
return
}

table.innerHTML=""

data.forEach((item)=>{

table.innerHTML += `
<tr>
<td>${item.company_name}</td>
<td>${item.umrah_gifts}</td>
<td dir="ltr">${item.phone}</td>
<td>
<button onclick="deleteCompany(${item.id})">
سڕینەوە
</button>
</td>
</tr>
`

})

}

window.deleteCompany = async function(id){

await supabase
.from("companies")
.delete()
.eq("id",id)

loadCompanies()

}

async function loadRegistrations(){

const table =
document.getElementById("registrations")

const count =
document.getElementById("count")

const { data,error } =
await supabase
.from("registrations")
.select("*")
.order("id",{ascending:false})

if(error){
console.log(error)
return
}

count.innerText = data.length

table.innerHTML=""

data.forEach((item,index)=>{

table.innerHTML += `
<tr>
<td>${index+1}</td>
<td>${item.full_name}</td>
<td dir="ltr">${item.phone}</td>
</tr>
`

})

}

</script>

</body>
</html>
