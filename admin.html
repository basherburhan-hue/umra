<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl =
'https://slllcibigutjivauryvc.supabase.co'

const supabaseKey =
'sb_publishable_NRCDy249HKEkJwKywxRw3Q_krlu95TH'

const supabase =
createClient(
supabaseUrl,
supabaseKey
)

const ADMIN_PASSWORD = "karwan123";

window.login = function(){

const pass =
document.getElementById("password").value;

if(pass === ADMIN_PASSWORD){

document.getElementById("loginBox").style.display="none";

document.getElementById("dashboard").classList.remove("hidden");

loadCompanies();
loadRegistrations();

}else{

alert("پاسوۆرد هەڵەیە");

}

}

window.addCompany = async function(){

const company_name =
document.getElementById("companyName").value;

const umrah_gifts =
document.getElementById("giftCount").value;

const phone =
document.getElementById("companyPhone").value;

if(!company_name || !umrah_gifts || !phone){

alert("هەموو خانەکان پڕبکەرەوە");
return;

}

const { error } =
await supabase
.from("companies")
.insert([
{
company_name,
umrah_gifts,
phone
}
])

if(error){

alert(error.message);
return;

}

document.getElementById("companyName").value="";
document.getElementById("giftCount").value="";
document.getElementById("companyPhone").value="";

loadCompanies();

}

async function loadCompanies(){

const table =
document.getElementById("companiesTable");

const { data,error } =
await supabase
.from("companies")
.select("*")
.order("id",{ascending:false})

if(error){

console.log(error);
return;

}

table.innerHTML="";

data.forEach((item)=>{

table.innerHTML += `
<tr>
<td>${item.company_name}</td>
<td>${item.umrah_gifts}</td>
<td dir="ltr">${item.phone}</td>
<td>
<button onclick="deleteCompany(${item.id})">
سڕینەوە
</button>
</td>
</tr>
`;

});

}

window.deleteCompany =
async function(id){

if(!confirm("دڵنیایت؟")) return;

await supabase
.from("companies")
.delete()
.eq("id",id);

loadCompanies();

}

async function loadRegistrations(){

const table =
document.getElementById("registrations");

const count =
document.getElementById("count");

const { data,error } =
await supabase
.from("registrations")
.select("*")
.order("id",{ascending:false})

if(error){

console.log(error);
return;

}

count.innerText = data.length;

table.innerHTML="";

data.forEach((item,index)=>{

table.innerHTML += `
<tr>
<td>${index+1}</td>
<td>${item.full_name}</td>
<td dir="ltr">${item.phone}</td>
</tr>
`;

});

}

</script>
